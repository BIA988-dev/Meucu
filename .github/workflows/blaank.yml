name: PC Virtual RDP

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Atualizar sistema
        run: |
          sudo apt-get update

      - name: Instalar ambiente gráfico e RDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            curl

      - name: Configurar senha do RDP
        run: |
          echo "runner:${{ secrets.VNC_PASSWORD }}" | sudo chpasswd

      - name: Configurar o XFCE
        run: |
          echo "startxfce4" > "$HOME/.xsession"
          chmod +x "$HOME/.xsession"

          sudo adduser xrdp ssl-cert

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar ao Tailscale
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="github-pc-virtual"

      - name: Iniciar servidor RDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sudo systemctl status xrdp --no-pager

      - name: Mostrar dados de conexão
        run: |
          echo "======================================"
          echo "PC VIRTUAL RDP INICIADO"
          echo "======================================"
          echo "IP Tailscale:"
          tailscale ip -4
          echo ""
          echo "Porta: 3389"
          echo "Usuário: runner"
          echo "Senha: valor do Secret VNC_PASSWORD"
          echo "======================================"

      - name: Manter a máquina ligada
        run: |
          sleep 20400
          
